name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-build.txt

      - name: Compilar aplicativo
        shell: pwsh
        run: .\build.ps1 -Python "python"

      - name: Publicar artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: NetrunnerOverlay-windows-x64
          path: |
            release/*.zip
            release/SHA256SUMS.txt

      - name: Criar Release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/*.zip release/SHA256SUMS.txt --generate-notes --title "Netrunner Overlay ${{ github.ref_name }}"

