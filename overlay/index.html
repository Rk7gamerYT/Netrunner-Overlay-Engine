<div id="log"></div>

<script
type="text/template"
id="chatlist_item"
>

<div
    class="chat-message {platform}"
    data-id="{messageId}"
>

    <span
        class="name"
        style="color:{color}"
    >
        {from}
    </span>

    <span class="colon">
        :
    </span>

    <span class="message">
        {message}
    </span>

</div>

</script>
